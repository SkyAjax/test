  }
}
@keyframes motion-drop-in-right {
  from {
    opacity: 0;
    transform: translateX(8px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
}
@keyframes motion-drop-out-right {
  from {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateX(8px) scale(0.98);
  }
}
@keyframes motion-spin {
  to {
    transform: rotate(360deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: var(--motion-duration-fast) !important;
    animation-iteration-count: 1 !important;
    transition-duration: var(--motion-duration-fast) !important;
    scroll-behavior: auto !important;
  }
}
html {
  color-scheme: light;
}

[data-theme=dark] {
  color-scheme: dark;
}

body {
  margin: 0;
  font-family: var(--font-family-base);
  /* Lining + tabular figures. We deliberately DON'T set
     `font-variation-settings: 'wdth' 100` — on a variable font that override
     stops `font-weight` from driving the `wght` axis, so every weight rendered
     as Regular. The default width is 100 anyway; letting `font-weight` map to
     `wght` natively restores Medium/Bold (buttons, headings, etc.). */
  font-feature-settings: "lnum" 1, "tnum" 1;
  font-size: var(--font-size-body, 16px);
  line-height: var(--line-height-body, 24px);
  color: var(--text-base);
  background: var(--bg-base);
  /* high-quality text rendering */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

.button-group { display: flex; width: 100%; align-items: center; gap: var(--size-024); }
.button-group__cluster { display: flex; align-items: center; gap: var(--size-008); }
.button-group.is-type-forms { align-items: center; }
.button-group.is-type-forms .button-group__tertiary { flex: 0 0 auto; }
.button-group.is-type-forms .button-group__cluster { flex: 1 1 0; min-width: 0; justify-content: flex-end; }
@media (max-width: 500px) {
  .button-group { flex-direction: column; align-items: stretch; gap: var(--size-008); }
  .button-group__cluster { flex-direction: column-reverse; align-items: stretch; width: 100%; gap: var(--size-008); }
  .button-group.is-type-forms .button-group__tertiary { order: 99; width: 100%; }
  .button-group .button { width: 100%; }
}

/* ---- Loader ---- */
.loader { position: fixed; inset: 0; z-index: 1200; display: flex; align-items: center; justify-content: center; padding: var(--page-margin-top) var(--page-margin-right) var(--page-margin-bottom) var(--page-margin-left); background: var(--scrim); pointer-events: none; opacity: 0; transition: opacity var(--motion-duration-base) var(--motion-ease-standard); }

.loader:not(.is-open) { transition: opacity var(--motion-duration-fast) var(--motion-ease-accelerate); }

.loader.is-open .loader__card { transform: scale(1); transform-origin: center; animation: motion-fade-in var(--motion-duration-fast) var(--motion-ease-standard), motion-pop-in var(--motion-duration-slow) var(--motion-ease-spring); }
.loader:not(.is-open) .loader__card { transform: scale(0.98); transition: transform var(--motion-duration-fast) var(--motion-ease-accelerate); }

<style>
/* ============ App layout (per Figma screens) ============ */
html, body { height: 100%; }
body { margin: 0; background: var(--bg-base); color: var(--text-base); font-family: var(--font-family-base); font-size: var(--font-size-body); line-height: var(--line-height-body); font-feature-settings: "lnum" 1, "tnum" 1; font-optical-sizing: none; }
* { box-sizing: border-box; }

.app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

/* ---- Side navigation panel (hand-made per instruction) ---- */
.side-nav { display: flex; flex-direction: column; width: 320px; min-width: 320px; height: 100%; background: var(--bg-foreground); box-shadow: 0 6px 18px -2px rgba(30, 40, 50, 0.10); overflow-y: auto; z-index: 20; }
.side-nav__slot { display: flex; flex-direction: column; padding: var(--size-016); width: 100%; }
.side-nav__slot--grow { flex: 1 1 0; justify-content: flex-end; }
.logo-img { display: block; flex: 0 0 auto; }

/* ---- Main column ---- */
.main { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; background: var(--bg-base); }
.top-strip { flex: 0 0 auto; height: 80px; background: var(--bg-base); border-bottom: 1px solid var(--border-subtle); }
.shell { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; padding: var(--page-margin-top) var(--page-margin-right) var(--page-margin-bottom) var(--page-margin-left); }
.page { width: 100%; max-width: 1360px; display: flex; flex-direction: column; position: relative; }

@media (max-width: 1239px) {
  .side-nav { display: none; }
  .nav-header { display: flex; }
  .top-strip { display: none; }
}

/* ---- Progress reveal ---- */
.progress-wrap { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows var(--motion-duration-base) var(--motion-ease-out-quint), opacity var(--motion-duration-base) var(--motion-ease-standard); }
.progress-wrap > div { min-height: 0; overflow: hidden; }
.progress-wrap.is-on { grid-template-rows: 1fr; opacity: 1; }

/* ---- Screen content transitions (header stays static) ---- */
#content { margin-top: var(--size-024); }
#content { will-change: opacity; }
#content.is-entering { animation: content-in var(--motion-duration-slow) var(--motion-ease-out-quint) both; }
.screen-ghost { position: absolute; left: 0; right: 0; pointer-events: none; z-index: 5; animation: content-out var(--motion-duration-base) var(--motion-ease-standard) forwards; }
@keyframes content-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes content-in { from { opacity: 0; } to { opacity: 1; } }

.stack { display: flex; flex-direction: column; gap: var(--size-032); }
.stack--cards { gap: var(--size-016); }

/* ---- Card ---- */
.card { background: var(--bg-foreground); border-radius: var(--radius-008); box-shadow: 0 1px 3px 0 rgba(30, 40, 50, 0.05); padding: var(--card-margin-top, 24px) var(--card-margin-right, 24px) var(--card-margin-bottom, 24px) var(--card-margin-left, 24px); width: 100%; }
.card--flush { padding: var(--card-margin-top, 24px) 0 var(--card-margin-bottom, 24px); overflow: hidden; }
.card--flush .card__title { padding: 0 var(--card-margin-left, 24px); }
.card__title { font-size: var(--font-size-heading-3); line-height: var(--line-height-heading-3); font-weight: var(--font-weight-heading-3); margin: 0; color: var(--text-base); }
.card .form-field + .form-field, .card .card__title + .form-field { margin-top: var(--size-016); }
.card__title + .sum-row { margin-top: var(--size-020); }

/* ---- Table (per Figma) ---- */
.tbl { margin-top: var(--size-008); }
.tbl__head, .tbl__row { display: grid; grid-template-columns: 40px 48px minmax(0, 2fr) 1.2fr 1fr 0.9fr 0.8fr; gap: var(--size-016); align-items: center; padding: 0 var(--card-margin-left, 24px); }
.tbl__head { padding-top: var(--size-012); padding-bottom: var(--size-012); }
.tbl__row { border-top: 1px solid var(--border-subtle); min-height: 72px; padding-top: var(--size-012); padding-bottom: var(--size-012); }
.tbl__row.row-new { animation: row-in 620ms var(--motion-ease-out-quint) 350ms both; }
@keyframes row-in { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }
.tbl__h { font-size: var(--font-size-body-small); line-height: var(--line-height-body-small); color: var(--text-subtle); }
.tbl__h--num, .tbl__c--num { text-align: center; color: var(--text-subtle); }
.tbl__h--avatar { }
.tbl__c { font-size: var(--font-size-body-small); line-height: var(--line-height-body-small); color: var(--text-base); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 48px; height: 48px; border-radius: 999px; background: var(--bg-subtle); display: inline-flex; align-items: center; justify-content: center; color: var(--icon-base); }
@media (max-width: 500px) {
  .tbl__head, .tbl__row { grid-template-columns: 44px minmax(0, 1fr) auto; padding: 0 var(--size-016); }
  .tbl__head { grid-template-columns: minmax(0, 1fr) auto; }
  .tbl__h--num, .tbl__c--num, .tbl__c--code, .tbl__h--code, .tbl__c--date, .tbl__h--date, .tbl__c--access, .tbl__h--access { display: none; }
  .tbl__h--avatar { display: none; }
  .avatar { width: 44px; height: 44px; }
  .tbl__row { min-height: 64px; }
}

/* ---- Summary rows ---- */
.sum-row { display: grid; grid-template-columns: minmax(180px, 288px) 1fr; gap: var(--size-016); margin-top: var(--size-016); }
.sum-label { font-size: var(--font-size-body-small); line-height: var(--line-height-body-small); color: var(--text-subtle); }
.sum-value { font-size: var(--font-size-body-small); line-height: var(--line-height-body-small); color: var(--text-base); }
@media (max-width: 767px) {
  .sum-row { grid-template-columns: 1fr; gap: var(--size-004); }
}

/* ---- Confirmation area ---- */
.confirm { margin-top: var(--size-048); }
.confirm hr { border: 0; border-top: 1px solid var(--border-subtle); margin: 0 0 var(--size-024); }
.checkbox { display: flex; align-items: flex-start; gap: var(--size-012); margin-bottom: var(--size-024); cursor: pointer; user-select: none; }
.checkbox input { position: absolute; opacity: 0; pointer-events: none; }
.checkbox__box { width: 16px; height: 16px; border-radius: var(--radius-004); border: 2px solid var(--border-base); background: var(--bg-foreground); flex: 0 0 auto; margin-top: 2px; display: inline-flex; align-items: center; justify-content: center; transition: background-color var(--motion-duration-fast) var(--motion-ease-standard), border-color var(--motion-duration-fast) var(--motion-ease-standard); }
.checkbox:hover input:not(:checked) + .checkbox__box { border-color: var(--border-hover); }
.checkbox input:checked + .checkbox__box { background: var(--bg-accent, #5c60ff); border-color: var(--bg-accent, #5c60ff); }
.checkbox input:focus-visible + .checkbox__box { box-shadow: 0 0 0 3px rgba(92, 96, 255, 0.35); }
.checkbox__box svg { opacity: 0; transform: scale(0.6); transition: opacity var(--motion-duration-base) var(--motion-ease-out-quint), transform var(--motion-duration-base) var(--motion-ease-soft-spring); }
.checkbox input:checked + .checkbox__box svg { opacity: 1; transform: scale(1); }
.checkbox__label { font-size: var(--font-size-body-small); line-height: var(--line-height-body-small); color: var(--text-base); }

/* ---- Footer ---- */
.footer { flex: 0 0 auto; display: flex; flex-direction: column; gap: var(--size-016); align-items: center; padding: var(--page-margin-top) var(--page-margin-right) var(--page-margin-bottom) var(--page-margin-left); background: var(--bg-base); width: 100%; }
.footer__links { display: flex; align-items: center; justify-content: center; gap: var(--size-016); flex-wrap: wrap; }
.footer__link { font-size: var(--font-size-body-small); line-height: var(--line-height-body-small); color: var(--text-base); cursor: pointer; white-space: nowrap; }
.footer__link:hover { text-decoration: underline; }
.footer__sep { width: 1px; height: 8px; background: var(--border-base); }
.footer__phone { display: none; font-size: var(--font-size-body-small); color: var(--text-base); }
.footer__copy { font-size: var(--font-size-footnote); line-height: var(--line-height-footnote); color: var(--text-subtle); text-align: center; width: 100%; margin: 0; }
@media (max-width: 500px) {
  .footer__links { flex-direction: column; gap: var(--size-012); }
  .footer__sep { display: none; }
  .footer__phone { display: block; }
  .footer__link--pricelist { display: none; }
}
</style>

function crumbHtml(list) {
  return list.map((c, i) => {
    const sep = i ? '<li aria-hidden="true" class="breadcrumbs__separator">/</li>' : '';
    const cur = c[1] === 'current';
    const link = c[1] === 'link';
    const type = cur ? 'breadcrumbs__crumb is-current' : 'breadcrumbs__crumb';
    const extra = cur ? ' is-current' : '';
    const click = link ? ' data-nav="list"' : '';
    return sep + '<li class="breadcrumbs__item"><a class="' + type + '"' + click + '>' + c[0] + '</a></li>';
  }).join('');
}

function updateHeader(key) {
  const s = SCREENS[key];
  document.getElementById('crumbs').innerHTML = crumbHtml(s.crumbs);
  document.getElementById('page-title').textContent = s.title;
  document.getElementById('page-actions').innerHTML = s.action
    ? '<button type="button" class="button is-size-md is-type-brand" data-nav="step1"><span class="button__label">Add New User</span></button>' : '';
  const wrap = document.getElementById('progress-wrap');
  const fill = document.getElementById('progress-fill');
  if (s.progress) {
    document.getElementById('progress-label').textContent = s.progress.label;
    wrap.classList.add('is-on');
    setTimeout(() => { fill.style.width = s.progress.pct + '%'; }, 30);
  } else {
    wrap.classList.remove('is-on');
    fill.style.width = '0%';
  }
  document.querySelectorAll('#crumbs [data-nav], #page-actions [data-nav]').forEach(el => el.addEventListener('click', () => goTo(el.dataset.nav)));
}

    '<div class="tbl__c--avatar">' + avatarHtml() + '</div>' +

      sumRow('LV84PARX82782789292 EUR (C prime)', 'View') + '</div>' +
    '<div class="card"><h3 class="card__title">Transaction Limits</h3>' +
      sumRow('Daily limit:', '1 000 EUR') + sumRow('Monthly limit:', '10 000 EUR') + '</div>' +
    '</div>' + footerButtons('Submit', 'step2', 'submit');
}

/* ================= Navigation with smooth transition ================= */
let current = null;
function goTo(key, instant) {
  if (key === current) return;
  const render = { list: renderList, step1: renderStep1, step2: renderStep2, summary: renderSummary }[key];
  current = key;
  if (instant) {
    updateHeader(key);
    content.innerHTML = render();
    bind(key);
    return;
  }
  // snapshot the old screen as a ghost overlay for a true crossfade
  const page = content.parentElement;
  const scrollShift = mainScroll.scrollTop;
  const ghost = content.cloneNode(true);
  ghost.removeAttribute('id');
  ghost.className = 'screen-ghost';
  ghost.style.top = (content.offsetTop - scrollShift) + 'px';
  ghost.style.clipPath = 'inset(0 0 -40px 0)';
  const prevH = content.offsetHeight;
  content.style.minHeight = Math.min(prevH, mainScroll.clientHeight) + 'px';
  updateHeader(key);
  content.innerHTML = render();
  bind(key);
  mainScroll.scrollTo({ top: 0 });
  page.appendChild(ghost);
  content.classList.remove('is-entering');
  void content.offsetWidth;
  content.classList.add('is-entering');
  ghost.addEventListener('animationend', () => ghost.remove(), { once: true });
  content.addEventListener('animationend', () => {
    content.classList.remove('is-entering');
    content.style.minHeight = '';
  }, { once: true });
}

/* ================= Validation (messages per Online Bank Library) ================= */
const EX = 'like 120874-18344';
function vRequired(v) { return v.trim() ? null : 'This field is mandatory.'; }
function vCode(v) {
  v = v.trim();
  if (!v) return 'This field is mandatory.';
  if (/[^0-9-]/.test(v)) return 'Use digits and a hyphen, ' + EX;
  const digits = v.replace(/-/g, '');
  if (digits.length < 11) return 'Enter all 11 digits, ' + EX;
  if (digits.length > 11) return 'Keep it to 11 digits, ' + EX;
  if (!/^\d{6}-\d{5}$/.test(v)) return 'Use digits and a hyphen, ' + EX;
  const dd = +v.slice(0, 2), mm = +v.slice(2, 4);
  if (dd < 1 || dd > 31 || mm < 1 || mm > 12) return 'This personal code does not exist. Check for typos.';
  return null;
}
function setError(id, error) {
  const box = document.getElementById('in-' + id);
  const wrap = document.getElementById('mw-' + id);
  const msg = document.getElementById('msg-' + id);
  if (!box) return !error;
  if (error) {
    box.classList.add('is-error');
    msg.textContent = error;
    wrap.classList.add('is-show');
  } else {
    box.classList.remove('is-error');
    wrap.classList.remove('is-show');
  }
  return !error;
}

/* ================= Bind per screen ================= */
function bind(key) {
  content.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => goTo(el.dataset.nav)));

  if (key === 'step1') {
    const fields = [['name', vRequired], ['surname', vRequired], ['code', vCode]];
    fields.forEach(([id, fn]) => {
      const el = document.getElementById('f-' + id);
      el.addEventListener('blur', () => { if (el.value || el.dataset.touched) setError(id, fn(el.value)); });
      el.addEventListener('input', () => setError(id, null));
    });
    document.getElementById('btn-next1').addEventListener('click', () => {
      let ok = true, firstErr = null;
      fields.forEach(([id, fn]) => {
        const el = document.getElementById('f-' + id);
        el.dataset.touched = '1';
        const good = setError(id, fn(el.value));
        if (!good && !firstErr) firstErr = el;
        ok = ok && good;
      });
      if (!ok) { firstErr.focus(); return; }
      state.name = document.getElementById('f-name').value.trim();
      state.surname = document.getElementById('f-surname').value.trim();
      state.code = document.getElementById('f-code').value.trim();
      goTo('step2');
    });
  }

  if (key === 'step2') {
    content.querySelectorAll('.dd').forEach(dd => {
      const trigger = dd.querySelector('.dd__trigger');
      trigger.addEventListener('click', () => toggleDd(dd));
      trigger.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllDd(); });
    });
    document.getElementById('btn-next2').addEventListener('click', () => goTo('summary'));
  }

  if (key === 'summary') {
    const agree = document.getElementById('agree');
    const submit = document.getElementById('btn-submit');
    agree.addEventListener('change', () => { submit.disabled = !agree.checked; });
    submit.addEventListener('click', () => {
      submit.classList.add('is-loading');
      submit.querySelector('.button__spinner').hidden = false;
      setTimeout(() => {
        const loader = document.getElementById('loader');
        loader.classList.add('is-open');
        setTimeout(() => {
          loader.classList.remove('is-open');
          state.submitted = true;
          goTo('list');
          setTimeout(showToast, 500);
        }, 1800);
      }, 350);
    });
  }
}

/* ================= Dropdown ================= */
function toggleDd(dd) {
  const open = dd.classList.contains('is-open');
  closeAllDd();
  if (open) return;
  dd.classList.add('is-open');
  dd.querySelector('.dd__trigger').setAttribute('aria-expanded', 'true');
  const key = dd.dataset.key;
  const menu = document.createElement('div');
  menu.className = 'dropdown';
  menu.setAttribute('role', 'listbox');
  menu.innerHTML = '<div class="dropdown__body"><div class="dropdown-section">' +
    OPTIONS.map(o =>
      '<button type="button" class="dropdown-item" role="option" data-value="' + o + '" aria-selected="' + (o === state.rights[key]) + '">' +
        '<span class="dropdown-item__body"><span class="dropdown-item__label">' + o + '</span></span>' +
        '<span class="dropdown-item__check' + (o === state.rights[key] ? ' is-on' : '') + '">' + ICONS.check + '</span>' +
      '</button>').join('') +
    '</div></div>';
  dd.appendChild(menu);
  menu.querySelectorAll('.dropdown-item').forEach(item => {
    item.addEventListener('click', () => {
      state.rights[key] = item.dataset.value;
      dd.querySelector('.dd__value').textContent = item.dataset.value;
      menu.querySelectorAll('.dropdown-item__check').forEach(c => c.classList.remove('is-on'));
      item.querySelector('.dropdown-item__check').classList.add('is-on');
      setTimeout(() => closeAllDd(), 160);
    });
  });
}
function closeAllDd() {
  document.querySelectorAll('.dd.is-open').forEach(dd => {
    dd.classList.remove('is-open');
    dd.querySelector('.dd__trigger').setAttribute('aria-expanded', 'false');
    const menu = dd.querySelector('.dropdown');
    if (menu) {
      menu.classList.add('is-leaving');
      menu.addEventListener('animationend', () => menu.remove(), { once: true });
    }
  });
}
document.addEventListener('click', e => { if (!e.target.closest('.dd')) closeAllDd(); });

/* ================= Toast (Storybook component behavior) ================= */
function showToast() {
  const vp = document.getElementById('toast-vp');
  vp.innerHTML = '<div class="toast is-type-success" style="--toast-duration:5000ms" role="status">' +
    '<div class="toast__body">' +
      '<span aria-hidden="true" class="toast__leading">' + ICONS.checkCircle + '</span>' +
      '<div class="toast__content"><div class="toast__heading">' +
        '<p class="toast__title">New user added</p>' +
        '<p class="toast__description">' + esc(state.name + ' ' + state.surname) + ' will receive a confirmation by SMS.</p>' +
      '</div>' +
      '<div class="toast__actions"><button type="button" class="text-button is-size-sm is-type-primary" id="toast-action"><span class="text-button__label">View user</span></button></div>' +
      '</div>' +
      '<button type="button" class="toast__close" aria-label="Dismiss">' + ICONS.x + '</button>' +
    '</div>' +
    '<div class="toast__timer"><div class="toast__progress"></div></div></div>';
  const toast = vp.firstElementChild;
  requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add('is-open')));
  toast.querySelector('.toast__close').addEventListener('click', () => hideToast(toast));
  toast.querySelector('#toast-action').addEventListener('click', () => hideToast(toast));
  toast.querySelector('.toast__progress').addEventListener('animationend', () => hideToast(toast));
}
function hideToast(toast) {
  if (!toast || toast.classList.contains('is-leaving')) return;
  toast.classList.add('is-leaving');
  toast.classList.remove('is-open');
  setTimeout(() => toast.remove(), 400);
}

});

/* ================= Utils + init ================= */
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
goTo('list', true);
</script>
